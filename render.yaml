# render.yaml — Render Deployment Configuration
# ================================================
# Render reads this file when the repository is connected.
# Secrets such as API keys and DATABASE_URL remain in Render Environment.

services:
  - type: web
    name: ai-rca-assistant
    runtime: python
    region: oregon
    plan: free

    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_MAX_RETRIES
        value: "2"
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-02-01"

      - key: DATABASE_URL
        sync: false

      # The ChromaDB retriever uses ChromaDB's own lightweight ONNX
      # embedding function, keeping the Render free-tier deployment light.
      - key: EMBEDDING_PROVIDER
        value: chromadb
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_PATH
        value: /tmp/chroma

      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "AI RCA Assistant"
      - key: APP_VERSION
        value: "1.0.0"
